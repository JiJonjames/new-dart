<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Seoul POI Platform - Phase 2: Map UI</title>
  <style>
    /* Leaflet CSS - Inline to bypass CSP */
    .leaflet-container { position: relative; outline: 0; overflow: hidden; }
    .leaflet-container a { color: #0078A8; }
    .leaflet-pane, .leaflet-tile, .leaflet-marker-icon, .leaflet-marker-shadow { position: absolute; left: 0; top: 0; }
    .leaflet-container .leaflet-pane { z-index: 400; }
    .leaflet-tile-pane { z-index: 2; }
    .leaflet-overlay-pane { z-index: 3; }
    .leaflet-shadow-pane { z-index: 1; }
    .leaflet-marker-pane { z-index: 4; }
    .leaflet-popup-pane { z-index: 50; }
    .leaflet-marker-icon, .leaflet-marker-shadow { display: block; }
    .leaflet-container .leaflet-marker-icon { margin-left: -12px; margin-top: -41px; }
    .leaflet-container .leaflet-popup { position: absolute; }

    /* ===== CSS Variables ===== */
    :root {
      --primary-blue: #0875F5;
      --search-green: #00C75A;
      --bg-white: #FFFFFF;
      --bg-secondary: #F5F7FA;
      --border-light: #E5E7EB;
      --text-primary: #222222;
      --text-secondary: #777777;
      --error-red: #E5484D;
      --success-green: #00A86B;
      --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.08);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.12);
    }

    /* ===== Base Styles ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', system-ui;
      background: var(--bg-white);
      color: var(--text-primary);
    }

    /* ===== Layout Structure ===== */
    #app {
      display: flex;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    /* Navigation Rail - Left */
    .nav-rail {
      width: 64px;
      height: 100vh;
      background: var(--bg-white);
      border-right: 1px solid var(--border-light);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 0;
      gap: 8px;
      z-index: 1000;
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }

    .nav-item {
      width: 48px;
      height: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      background: transparent;
      font-size: 20px;
      color: var(--text-secondary);
    }

    .nav-item:hover {
      background: var(--bg-secondary);
      color: var(--text-primary);
    }

    .nav-item.active {
      background: var(--primary-blue);
      color: white;
    }

    .nav-label {
      font-size: 10px;
      font-weight: 600;
      text-align: center;
      word-break: break-word;
      line-height: 1.1;
    }

    /* Sidebar - Right */
    .sidebar {
      width: 400px;
      height: 100vh;
      background: var(--bg-white);
      border-left: 1px solid var(--border-light);
      display: flex;
      flex-direction: column;
      z-index: 50;
      flex-shrink: 0;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .sidebar.closed {
      transform: translateX(100%);
      box-shadow: none;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .sidebar-header-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .sidebar-close-btn {
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .sidebar-close-btn:hover {
      background: var(--bg-secondary);
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sidebar-content::-webkit-scrollbar {
      width: 6px;
    }

    .sidebar-content::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 3px;
    }

    /* Map Container - Center */
    .map-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* Search Bar - Floating */
    .search-container {
      position: absolute;
      top: 16px;
      left: 80px;
      right: 420px;
      z-index: 20;
      background: white;
      border-radius: 8px;
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      padding: 12px 16px;
      gap: 12px;
    }

    .search-container.sidebar-closed {
      right: 16px;
    }

    .search-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 14px;
      color: var(--text-primary);
    }

    .search-input::placeholder {
      color: var(--text-secondary);
    }

    .search-btn {
      border: none;
      background: var(--search-green);
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      transition: background 0.2s;
    }

    .search-btn:hover {
      background: #00A647;
    }

    /* Map Controls - Right */
    .map-controls {
      position: absolute;
      bottom: 24px;
      right: 24px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-btn {
      width: 44px;
      height: 44px;
      background: white;
      border: 1px solid var(--border-light);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: all 0.2s;
      box-shadow: var(--shadow-sm);
    }

    .control-btn:hover {
      background: var(--bg-secondary);
      box-shadow: var(--shadow-md);
    }

    /* Cafe List */
    .cafe-list-item {
      padding: 12px;
      border: 1px solid var(--border-light);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .cafe-list-item:hover {
      background: var(--bg-secondary);
      border-color: var(--primary-blue);
    }

    .cafe-list-item.selected {
      background: var(--bg-secondary);
      border-color: var(--primary-blue);
      border-width: 2px;
    }

    .cafe-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .cafe-info {
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .cafe-rating {
      color: #FFB000;
      font-weight: 600;
    }

    /* Cafe Detail Card */
    .cafe-detail {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .cafe-detail.active {
      display: flex;
    }

    .detail-image {
      width: 100%;
      height: 160px;
      border-radius: 8px;
      background: var(--bg-secondary);
      background-size: cover;
      background-position: center;
    }

    .detail-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .detail-rating {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    .detail-rating-stars {
      color: #FFB000;
      font-size: 16px;
    }

    .detail-info-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 13px;
    }

    .detail-info-label {
      color: var(--text-secondary);
      font-weight: 600;
    }

    .detail-info-value {
      color: var(--text-primary);
    }

    .detail-amenities {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .amenity-tag {
      background: var(--bg-secondary);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      color: var(--text-primary);
    }

    .detail-buttons {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .detail-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border-light);
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s;
      background: white;
      color: var(--text-primary);
    }

    .detail-btn:hover {
      background: var(--bg-secondary);
    }

    .detail-btn.primary {
      background: var(--primary-blue);
      color: white;
      border-color: var(--primary-blue);
    }

    .detail-btn.primary:hover {
      background: #0056d4;
    }

    /* ===== Animations ===== */
    @keyframes slideInUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .sidebar {
      animation: slideInUp 0.3s ease-out;
    }

    .cafe-list-item {
      animation: fadeIn 0.2s ease-out;
    }

    .nav-item, .control-btn, .detail-btn, .search-btn {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .detail-btn:active {
      transform: scale(0.98);
    }

    *:focus-visible {
      outline: 2px solid var(--primary-blue);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Sidebar Toggle Button */
    .sidebar-toggle-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 25;
      width: 36px;
      height: 36px;
      background: white;
      border: 1px solid var(--border-light);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s;
    }

    .sidebar-toggle-btn:hover {
      background: var(--bg-secondary);
    }

    .sidebar-toggle-btn.hidden {
      display: none;
    }

    /* ===== Responsive ===== */
    @media (max-width: 768px) {
      #app {
        flex-direction: column;
      }

      .nav-rail {
        width: 100%;
        height: 56px;
        flex-direction: row;
        border-right: none;
        border-top: 1px solid var(--border-light);
        padding: 8px 12px;
        order: 2;
      }

      .nav-item {
        width: 44px;
        height: 44px;
      }

      .map-container {
        order: 1;
        height: calc(100vh - 112px);
      }

      .sidebar {
        width: 100%;
        height: 56px;
        border-left: none;
        border-top: 1px solid var(--border-light);
        order: 3;
      }

      .sidebar.closed {
        transform: translateY(100%);
      }

      .search-container {
        left: 12px;
        right: 12px;
        top: 8px;
      }

      .sidebar-toggle-btn {
        display: none;
      }
    }
  </style>
</head>

    // ===== Search & Filter Functions =====
    function filterCafes(query = '', filters = {}) {
      let results = state.places.filter(cafe => {
        // Search query filter
        if (query) {
          const q = query.toLowerCase();
          const matchesName = cafe.name.toLowerCase().includes(q);
          const matchesGu = cafe.gu.toLowerCase().includes(q);
          const matchesAddress = cafe.address.toLowerCase().includes(q);
          if (!matchesName && !matchesGu && !matchesAddress) return false;
        }

        // Gu filter
        if (filters.gu && cafe.gu !== filters.gu) return false;

        // Rating filter
        if (filters.minRating && cafe.rating < filters.minRating) return false;

        // Amenities filter
        if (filters.amenities && filters.amenities.length > 0) {
          const hasAllAmenities = filters.amenities.every(amenity =>
            cafe.amenities.includes(amenity)
          );
          if (!hasAllAmenities) return false;
        }

        return true;
      });

      state.filteredPlaces = results;
      return results;
    }

    function getAutocompleteSuggestions(query) {
      if (!query) return [];
      const q = query.toLowerCase();

      const suggestions = new Set();
      state.places.forEach(cafe => {
        if (cafe.name.toLowerCase().includes(q)) suggestions.add(cafe.name);
        if (cafe.gu.toLowerCase().includes(q)) suggestions.add(cafe.gu);
      });

      return Array.from(suggestions).slice(0, 5);
    }

    // ===== Analysis Functions =====
    function haversineDistance(lat1, lng1, lat2, lng2) {
      const R = 6371; // Earth's radius in km
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLng = (lng2 - lng1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLng/2) * Math.sin(dLng/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    function analyzeLocation(lat, lng, radius = 1.0) {
      const nearbyCafes = state.places.filter(cafe => {
        const distance = haversineDistance(lat, lng, cafe.lat, cafe.lng);
        return distance <= radius;
      });

      const area = Math.PI * radius * radius;
      const saturation = nearbyCafes.length / area;
      const avgRating = nearbyCafes.length > 0 ?
        (nearbyCafes.reduce((sum, c) => sum + c.rating, 0) / nearbyCafes.length).toFixed(2) : 0;
      const totalReviews = nearbyCafes.reduce((sum, c) => sum + c.reviews, 0);

      // Success Probability (0-100%)
      const saturationScore = Math.max(0, 100 - saturation * 20);
      const ratingScore = avgRating * 10;
      const reviewScore = Math.min(50, totalReviews / 10);

      const successProbability = Math.round((saturationScore * 0.4 + ratingScore * 0.3 + reviewScore * 0.3));

      return {
        location: { lat, lng },
        nearbyCafes: nearbyCafes.length,
        saturation: saturation.toFixed(2),
        avgRating,
        totalReviews,
        area: area.toFixed(2),
        successProbability: Math.min(100, successProbability),
        riskLevel: successProbability > 70 ? '낮음' : successProbability > 40 ? '중간' : '높음'
      };
    }

    function getGuAnalysis() {
      const guData = {};
      state.places.forEach(cafe => {
        if (!guData[cafe.gu]) {
          guData[cafe.gu] = { count: 0, totalRating: 0, totalReviews: 0 };
        }
        guData[cafe.gu].count++;
        guData[cafe.gu].totalRating += cafe.rating;
        guData[cafe.gu].totalReviews += cafe.reviews;
      });

      return Object.entries(guData).map(([gu, data]) => ({
        gu,
        count: data.count,
        avgRating: (data.totalRating / data.count).toFixed(2),
        totalReviews: data.totalReviews,
        saturation: (data.count / 5).toFixed(2)
      })).sort((a, b) => b.count - a.count);
    }

        state.searchQuery = query;

          filterCafes(query, state.activeFilters);
          state.activeView = 'home';
          renderSidebar();
          createMarkers();
        } else {
          state.filteredPlaces = [];
          renderSidebar();
          createMarkers();
        }
      });

      searchBtn.addEventListener('click', () => {
        const query = searchInput.value.trim();
        state.searchQuery = query;
        filterCafes(query, state.activeFilters);
        renderSidebar();
        createMarkers();
        openSidebar();
      });

      searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          const query = searchInput.value.trim();
          state.searchQuery = query;
          filterCafes(query, state.activeFilters);
          renderSidebar();
          createMarkers();
          openSidebar();
        }
      });
